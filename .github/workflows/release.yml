# Tag-driven release.
#
#   node scripts/version.mjs set 0.2.0 && git commit -am "v0.2.0"
#   git tag v0.2.0 && git push origin main v0.2.0
#
# Gate:   the tag must equal the committed version (scripts/version.mjs check).
# Build:  pnpm install → typecheck → build → scripts/package-desktop.mjs
# Output: GitHub Release "v<version>" with
#           onenightcarnival-dsh-bridge-browser-<version>.tgz
#           dsh-browser-extension-chrome-<version>.zip
#           SHA256SUMS.txt
#         A prerelease label (v0.2.0-rc.1) marks the Release as pre-release.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check tag against committed version
        run: node scripts/version.mjs check "${GITHUB_REF_NAME#v}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Package
        run: |
          node scripts/package-desktop.mjs
          ls -l dist-desktop
          tar -tzf dist-desktop/*.tgz

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--title "$GITHUB_REF_NAME" --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist-desktop/* "${args[@]}"
