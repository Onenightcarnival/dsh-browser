name: Release desktop artifacts

# Pushing a `v*` tag builds the bridge plugin tarball and the Chrome
# extension zip (scripts/package-desktop.mjs) and attaches them, with
# SHA256SUMS.txt, to a GitHub Release for that tag. DeepSeek Harness Desktop
# users install the .tgz from 配置中心 → 插件 → 「从 .tgz 安装」 and load the
# unzipped extension folder at chrome://extensions.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - name: Install into a fresh store
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/dsh-pnpm-store"
      - run: pnpm run check:runtime
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm run test:smoke
      - run: node scripts/package-desktop.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-artifacts
          path: dist-desktop/*
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist-desktop/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
