# Release: push a tag like v1.2.3 (or v1.2.3-rc.1) and this workflow builds
# the bridge plugin and the Chrome extension, packs them as
# onenightcarnival-dsh-bridge-browser-<version>.tgz and
# dsh-browser-extension-chrome-<version>.zip, and attaches both (with
# SHA256SUMS.txt) to a GitHub Release for that tag. The version inside the
# artifacts always comes from the tag name, not from the version fields
# committed in the repository.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not in vX.Y.Z or vX.Y.Z-prerelease form"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set versions from tag
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Pack
        run: |
          node scripts/package-desktop.mjs
          ls -l dist-desktop
          tar -tzf dist-desktop/*.tgz

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--title "$GITHUB_REF_NAME" --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist-desktop/* "${args[@]}"
